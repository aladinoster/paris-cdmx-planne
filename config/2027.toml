# Planner input for 2027. Every value here can be edited; dates are YYYY-MM-DD.
# "me" = Andrés (based in Paris, France); "her" = Laura (based in Mexico City).

year = 2027

[names]
me = "Andrés"   # based in Paris
her = "Laura"   # based in Mexico City
# Which places FREE trips may use: "home" (Paris or Mexico City), "both" (home or a third city), "meet" (third cities only).
mode = "both"

[leave]
me = 45   # your annual leave days
her = 22  # her annual leave days

[trips]
min_days = 7     # shortest free trip (days, both travel days included)
max_days = 16    # longest free trip; fixed trips may be longer
min_gap = 14     # minimum days apart between two trips
max_gap = 200    # longest gap the solver will consider

[value]
day = 120                 # € value of one day together
host_working_factor = 0.6 # value multiplier on days the host is at work (evenings + weekends only)
travel_day_factor = 0.5   # first and last day of a trip count this much
trip_overhead = 150       # € fixed cost per trip (transfers, jet lag, logistics)
gap_target = 45           # gaps longer than this many days are penalised...
gap_lambda = 0.15         # ...by gap_lambda * (gap - gap_target)^2 €

[her_constraints]
month_end_days = 5        # she can't take leave in the last N days of each month
block_august = true       # she can't take leave in August
extra_blackout = []       # any other dates she can't take off

[holidays]
# Days off that don't consume leave (weekends are always off).
me = ["2027-01-01", "2027-03-29", "2027-05-01", "2027-05-06", "2027-05-08", "2027-05-17",
      "2027-07-14", "2027-08-15", "2027-11-01", "2027-11-11", "2027-12-25"]
# Mexican federal holidays + Holy Thursday/Friday and Día de Muertos (edit to her employer's calendar).
her = ["2027-01-01", "2027-02-01", "2027-03-15", "2027-03-25", "2027-03-26", "2027-05-01",
       "2027-09-16", "2027-11-02", "2027-11-15", "2027-12-25"]

[fares]
scale = 1.0                       # multiply every fare (use after checking live prices)
weekend_departure_surcharge = 0.04
sunday_return_surcharge = 0.03    # home trips only
reference_day = "05-13"           # third-city fares are quoted for this departure day
# Which fare the optimiser plans with: "low" (cheapest seen), "typical" (expected), "cautious" (90th percentile).
basis = "typical"
# Price band: a ticket actually bought = lowest-seen fare × m, m ~ Triangular(band_low, band_mode, band_high).
# Calibrated on data/fares.csv: identical dates differed ~7% across sites; nonstop / unlucky booking up to +30%.
band_low = 1.00
band_mode = 1.08
band_high = 1.30
# LOWEST round-trip economy fare (EUR, 9–11 nights) seen per month across Kiwi.com, lastminute.com and LetsFG
# (see data/fares.csv), piecewise constant from each MM-DD, then 5-day smoothed. Dec, early Jan and Nov for her are
# estimates (not yet on sale / thin inventory).
curve.me = [["01-01", 1250], ["01-06", 882], ["02-01", 854], ["03-01", 936], ["04-01", 931], ["05-01", 838],
            ["06-01", 1097], ["07-01", 1101], ["08-01", 1085], ["09-01", 835], ["10-01", 983], ["11-01", 990],
            ["11-15", 950], ["12-01", 1000], ["12-15", 1400]]
curve.her = [["01-01", 1350], ["01-06", 766], ["02-01", 876], ["03-01", 876], ["04-01", 738], ["05-01", 731],
             ["06-01", 798], ["07-01", 999], ["08-01", 736], ["09-01", 735], ["10-01", 735], ["11-01", 950],
             ["12-01", 1000], ["12-12", 1350]]
# Raw observations live in data/fares.csv (loaded with meetplan.prices.load_quotes).

# Fixed trips. start/end ranges let the solver slide a trip; equal bounds lock the dates.
# where: "me" (you fly to CDMX), "her" (she flies to Paris), "home" (optimiser picks who),
#        "meet:<city id>", "meet:any" (optimiser picks the city), "anywhere".
[[fixed_trips]]
label = "February, Andrés goes"
start = ["2027-02-04", "2027-02-04"]
end = ["2027-02-15", "2027-02-15"]
where = "me"

[[fixed_trips]]
label = "March, New York together"
start = ["2027-03-18", "2027-03-18"]
end = ["2027-03-28", "2027-03-28"]
where = "meet:nyc"

[[fixed_trips]]
label = "June, Laura comes (Marseille)"
start = ["2027-06-12", "2027-06-12"]
end = ["2027-06-27", "2027-06-27"]
where = "her"

[[fixed_trips]]
label = "Late Oct to early Nov, Andrés goes"
start = ["2027-10-22", "2027-10-31"]
end = ["2027-11-01", "2027-11-10"]
where = "me"

# Third cities. ref_me / ref_her: normalised midweek round-trip fare (EUR) from Paris / Mexico City
# at fares.reference_day; moved through the year with each origin's curve.
# lodging: € per night for two. bonus: extra € value per day of holiday there. enabled: allow it.
